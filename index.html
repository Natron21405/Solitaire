<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pastel Solitaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fb0cb">
<meta name="description" content="Klondike solitaire, draw three, with guaranteed-winnable deals.">

<!-- iOS home-screen app -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Solitaire">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/christmas.css">
<script>/* apply a saved theme before first paint, so a relaunch never flashes */
try{var x=JSON.parse(localStorage.getItem('pastel-solitaire-xmas')||'{}');if(x.unlocked&&x.on)document.documentElement.classList.add('xmas');}catch(e){}</script>
</head>
<body>

<div id="app">
  <div id="hud">
    <span id="hud-mode">Winnable</span>
    <span class="hud-mid">
      <span>Time <b id="hud-time">0:00</b></span>
      <span>Moves <b id="hud-moves">0</b></span>
    </span>
    <span id="hud-seed">#0</span>
  </div>

  <div id="board"></div>

  <div id="toolbar">
    <button id="btn-undo"  type="button"><span class="ic">&#8630;</span>Undo</button>
    <button id="btn-new"   type="button"><span class="ic">&#9826;</span>New</button>
    <button id="btn-stats" type="button"><span class="ic">&#9673;</span>Stats</button>
    <button id="btn-hint"  type="button"><span class="ic">&#9788;</span>Hint</button>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="js/cardart.js"></script>
<script src="js/solver.js"></script>
<script src="js/deal.js"></script>
<script src="js/game.js"></script>
<script src="js/stats.js"></script>
<script src="js/xmas.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
